name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            archive: devptp-linux-x86_64.tar.gz
          - name: windows-x86_64
            target: x86_64-pc-windows-gnu
            archive: devptp-windows-x86_64.zip
          - name: linux-aarch64
            target: aarch64-unknown-linux-gnu
            archive: devptp-linux-aarch64.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build release binary
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Package Unix binary
        if: matrix.target != 'x86_64-pc-windows-gnu'
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/devptp package/devptp
          tar -C package -czf ${{ matrix.archive }} devptp

      - name: Package Windows binary
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/devptp.exe package/devptp.exe
          cd package
          zip ../${{ matrix.archive }} devptp.exe

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
