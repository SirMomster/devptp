[package]
name = "devptp"
version = "0.1.2"
edition = "2024"
license = "MIT"
readme = "README.md"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "devptp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.5.0", features = ["derive", "cargo"] }
iroh = "1.0.2"
iroh-ping = "1.0.0"
iroh-tickets = "1.0.0"
tokio = { version = "1.52.3", features = ["full"] }
tracing-subscriber = "0.3.23"
ratatui = "0.29.0"
crossterm = "0.28.1"
derive_more = { version = "2.1.1", features = ["from"] }
interprocess = { version = "2.4.3", features = ["tokio"] }
jni = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6+spec-1.1.0"
