version: '3.8'
services:
  develop:
    build:
      context: .
      dockerfile: ./Dockerfile
    volumes:
      - ..:/workspace/devptp:cached
    # Allows adb inside the container to access a USB-connected Android device.
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    command: sleep infinity
